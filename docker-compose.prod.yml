services:
  postgres:
    image: postgres:17-alpine
    container_name: analyzepanel-db
    environment:
      POSTGRES_DB: ${DB_NAME:-analyzepanel_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-analyzepanel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - analyzepanel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analyzepanel-backend
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-analyzepanel_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${APPLICATION_SECURITY_JWT_SECRET_KEY}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS}
      APP_STORAGE_PATH: /var/lib/analyzepanel/uploads
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-prod}
      TZ: UTC
    volumes:
      - app_uploads:/var/lib/analyzepanel/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 5
    networks:
      - analyzepanel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyzepanel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - analyzepanel-network

networks:
  analyzepanel-network:
    driver: bridge

volumes:
  postgres_data:
  app_uploads:
