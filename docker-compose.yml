services:
  postgres:
    image: postgres:17-alpine
    container_name: analyzepanel-db
    environment:
      POSTGRES_DB: ${DB_NAME:-analyzepanel_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-analyzepanel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
