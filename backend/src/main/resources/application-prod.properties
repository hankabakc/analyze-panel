# Canlı ortam yapılandırması (T-069 / S-027).
#
# Bu dosya SIR BARINDIRMAZ ve depoda durur. Gizli değerlerin hiçbirinin varsayılanı yoktur:
# ortam değişkeni verilmezse uygulama AÇILMAZ ve hangi değişkenin eksik olduğunu söyler (ENG-10 §1).
# Değişkenlerin tam listesi ve açıklamaları kök dizindeki .env.example dosyasındadır.

# --- Sunucu ---
server.port=${SERVER_PORT:8081}

# --- Veritabanı ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Şema yalnızca migrasyonla değişir (ENG-08 §3.2). Canlıda doğrulama açık, otomatik onarım kapalı:
# kod ile şema ayrışırsa uygulama sessizce devam etmek yerine açılmaz.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false
spring.flyway.baseline-on-migrate=false

# Sorgular servis sınırında biter; görünüm katmanında tembel yükleme yok.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Bağlantı havuzu (tek instance, 200 kullanıcıya kadar — S-027) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# --- Dağıtım: işlenen istek yarıda kesilmez ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Sırlar: varsayılan yok ---
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
application.security.pii.encryption-key=${PII_ENCRYPTION_KEY}
application.security.initial-admin-email=${INITIAL_ADMIN_EMAIL}

# --- Oturum çerezi: canlıda yalnızca HTTPS üzerinden taşınır ---
app.cookie.secure=true
app.cookie.same-site=Lax

# --- CORS: yalnızca kendi alan adı (örn. https://ornekkurum.com) ---
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# --- Karne dosyalarının kalıcı diskteki yeri ---
app.storage.path=${APP_STORAGE_PATH}

# --- Hata izleme ---
sentry.dsn=${SENTRY_DSN}
sentry.environment=${SENTRY_ENVIRONMENT:prod}

# Kişisel veri hata kayıtlarına gönderilmez (APP-03 §4). Gerçek bir olayla doğrulaması T-070.
sentry.send-default-pii=false

# --- Zaman: her yerde UTC (ENG-03 §1.3) ---
spring.jackson.time-zone=UTC

# --- Günlük: canlıda ayrıntı yok ---
logging.level.root=INFO
logging.level.com.hankabakc.analyzepanel=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-SYSTEM}] - %msg%n

# --- Actuator ve Gözlemlenebilirlik (T-070 / S-027) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

